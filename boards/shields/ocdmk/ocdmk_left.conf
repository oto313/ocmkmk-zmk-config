# OCDMK Left Shield - Central Role
# The left half is the "central" - it connects to the computer via USB.
#
# Wired split (default): no BLE radio; UART transport auto-selected by DTS node.
# BLE split: build with -DCONFIG_ZMK_BLE=y; selects BT stack + BLE split transport.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=y

# =============================================================================
# BACKLIGHT CONFIGURATION
# =============================================================================
# CONFIG_ZMK_BACKLIGHT is enabled by default in Kconfig.defconfig
# Uncomment the line below to disable it:
# CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_BACKLIGHT_BRT_START=60
CONFIG_ZMK_BACKLIGHT_BRT_STEP=20
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n


CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=50000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=100000
# =============================================================================
# OTHER FEATURES
# =============================================================================
# Enable indicator LED driver
CONFIG_INDICATOR_LED=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Uncomment for USB logging (debugging)
# CONFIG_ZMK_USB_LOGGING=y
