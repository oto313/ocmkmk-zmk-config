# OCDMK Right Shield - Peripheral Role
# The right half is the "peripheral" - it sends key data to the left half
# (peripheral is the default when ROLE_CENTRAL is not set)
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
# nRF52833 has USB hardware so ZMK_USB defaults y; explicitly disable it on
# the peripheral since only the central (left) connects to a host.
CONFIG_ZMK_USB=n

# =============================================================================
# BACKLIGHT CONFIGURATION
# =============================================================================
# CONFIG_ZMK_BACKLIGHT is enabled by default in Kconfig.defconfig
# Uncomment the line below to disable it:
# CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_BACKLIGHT_BRT_START=60
CONFIG_ZMK_BACKLIGHT_BRT_STEP=20
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# Persist backlight (and other) settings 5 s after a change instead of the
# default 60 s, so the state survives a quick restart.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=5000

# Idle after 50 s (backlight off), deep sleep after 15 min; a key press wakes it.
# Same timeouts as the left half.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=50000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# =============================================================================
# OTHER FEATURES
# =============================================================================

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Uncomment for USB logging (debugging)
# CONFIG_ZMK_USB_LOGGING=y
