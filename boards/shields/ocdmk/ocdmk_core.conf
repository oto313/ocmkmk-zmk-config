# OCDMK Shield Configuration

# =============================================================================
# NFC PINS AS GPIO
# =============================================================================
# P0.09 (NFC1) and P0.10 (NFC2) are nRF52833 NFC antenna pins.
# The right half uses them for kscan rows 0 and 1; the left uses P0.10 for
# row 3. Without this option they stay in NFC mode and cannot be driven as
# GPIO outputs, causing those rows to be unresponsive.
CONFIG_NFCT_PINS_AS_GPIOS=y

# =============================================================================
# SPLIT KEYBOARD CONFIGURATION
# =============================================================================
CONFIG_ZMK_SPLIT=y

# Split transport is selected automatically by the build:
#   Wired (default): the wired_split DTS node enables CONFIG_ZMK_SPLIT_WIRED
#   BLE: pass -DCONFIG_ZMK_BLE=y at build time; the DTS guard excludes wired_split

# =============================================================================
# BACKLIGHT CONFIGURATION
# =============================================================================
# CONFIG_ZMK_BACKLIGHT is enabled by default in Kconfig.defconfig
# Uncomment the line below to disable it:
# CONFIG_ZMK_BACKLIGHT=n

# CONFIG_ZMK_BACKLIGHT_BRT_START=0
# CONFIG_ZMK_BACKLIGHT_BRT_STEP=20
# CONFIG_ZMK_BACKLIGHT_ON_START=n
# CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

# =============================================================================
# OTHER FEATURES
# =============================================================================
# Enable indicator LED driver
CONFIG_INDICATOR_LED=y

# Uncomment to enable the display
# CONFIG_ZMK_DISPLAY=y

# Uncomment for USB logging (debugging)
# CONFIG_ZMK_USB_LOGGING=y