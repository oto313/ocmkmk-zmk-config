description: |
  Indicator LED driver.
  Blinks on startup, blinks when battery < 20% and not charging.
  Uses BQ25185 STAT1/STAT2 pins for charge status detection.

compatible: "zmk,indicator-led"

properties:
  led-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to LED output (active high)

  stat1-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to STAT1 input from charger

  stat2-gpios:
    type: phandle-array
    required: true
    description: GPIO connected to STAT2 input from charger
